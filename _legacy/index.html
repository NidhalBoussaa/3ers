<style>
:root{
  --gold:#c9a44c;--gold-bright:#f1d894;--gold-soft:#e7cf8e;--gold-deep:#8c6d2a;
  --champagne:#f7f1e3;--cream:#faf6ec;--ink:#2c2114;--ink-soft:#5b4e3a;
  --night:#0b0805;--night-2:#171009;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Cormorant Garamond',serif;background:var(--night);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--gold);color:#fff}
img{max-width:100%;height:auto}
button{font:inherit}

#dust{position:fixed;inset:0;z-index:1;pointer-events:none}
.petal{position:fixed;top:-40px;z-index:2;pointer-events:none;opacity:0;will-change:transform}
.petal svg{display:block}

/* ===== INTRO ===== */
#intro{position:fixed;inset:0;z-index:60;background:#0b0805;overflow:hidden;transition:opacity 1.2s ease, visibility 1.2s ease}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
#introVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0b0805;z-index:1;opacity:0;transition:opacity 1s ease}
#intro.playing #introVideo{opacity:1}
.video-veil{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,8,5,.25) 0%,rgba(11,8,5,0) 28%,rgba(11,8,5,0) 65%,rgba(11,8,5,.55) 100%)}

.enter-btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  width:160px;height:160px;border-radius:50%;
  background:linear-gradient(165deg,rgba(241,216,148,.18),rgba(11,8,5,.4));
  border:1px solid var(--gold-bright);
  font-family:'Marcellus',serif;font-size:26px;letter-spacing:3px;color:#f6ecd2;
  cursor:pointer;backdrop-filter:blur(8px);
  text-shadow:0 2px 14px rgba(0,0,0,.6);
  animation:pulseGlow 2.4s ease-in-out infinite;
  transition:opacity .6s ease, transform .35s ease}
.enter-btn::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(241,216,148,.28);animation:ring2 2.5s ease-out infinite;pointer-events:none}
.enter-btn:hover{transform:translate(-50%,-50%) scale(1.05)}
.enter-btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:6px}
#intro.playing .enter-btn{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.85)}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(241,216,148,.35),inset 0 0 22px rgba(241,216,148,.18)}
  50%   {box-shadow:0 0 0 18px rgba(241,216,148,0), inset 0 0 30px rgba(241,216,148,.32)}
}
@keyframes ring2{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.6);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

/* ===== MAIN ===== */
#main{position:relative;z-index:3}
.stage{position:relative;background:
  radial-gradient(circle at 18% 8%,rgba(201,164,76,.10),transparent 42%),
  radial-gradient(circle at 82% 92%,rgba(201,164,76,.10),transparent 42%),
  linear-gradient(180deg,#fbf8f0 0%,var(--cream) 40%,#f4eedd 100%)}
.frame{max-width:720px;margin:0 auto;position:relative;padding:70px 28px 90px;text-align:center}
.frame::before,.frame::after{content:"";position:absolute;top:40px;bottom:40px;width:1px;
  background:linear-gradient(180deg,transparent,rgba(201,164,76,.5) 12%,rgba(201,164,76,.5) 88%,transparent)}
.frame::before{left:14px}.frame::after{right:14px}

/* reveal on scroll */
.r{opacity:0;transform:translateY(40px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
.r.in{opacity:1;transform:none}
.r.scale{transform:translateY(40px) scale(.94)}.r.scale.in{transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.18s}.d3{transition-delay:.28s}.d4{transition-delay:.38s}

/* ornamental divider */
.orn{display:block;margin:34px auto;width:200px;max-width:70%}
.orn path,.orn line{stroke:var(--gold);stroke-width:1.1;fill:none;stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset 1.6s ease}
.orn.in path,.orn.in line{stroke-dashoffset:0}
.orn .diamond{fill:var(--gold);stroke:none;opacity:0;transition:opacity .8s .9s}
.orn.in .diamond{opacity:1}

.bismillah{font-family:'Amiri',serif;font-size:clamp(20px,5vw,26px);color:var(--gold-deep);direction:rtl;line-height:1.6}
.verse{font-family:'Amiri',serif;font-size:clamp(15px,4vw,18px);line-height:2.05;color:#6a5c44;direction:rtl;max-width:560px;margin:18px auto 4px}

.invite-fr{font-style:italic;font-size:clamp(18px,4.6vw,22px);color:#4a3e2c;line-height:1.55;font-weight:400}
.invite-ar{font-family:'Amiri',serif;font-size:clamp(15px,4vw,18px);color:#6a5c44;direction:rtl;margin-top:8px;line-height:1.9}

.names-wrap{margin:30px 0 6px;position:relative}
.name{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:clamp(34px,11vw,72px);line-height:1.02;letter-spacing:1px;
  background:linear-gradient(165deg,#e8c977 0%,#a9842f 45%,#7c5f23 60%,#d8b96a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.4))}
.amp{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(40px,12vw,82px);line-height:.6;display:block;margin:2px 0;
  background:linear-gradient(180deg,#f0d68f,#c9a44c);-webkit-background-clip:text;background-clip:text;color:transparent}
.surnames{font-family:'Cinzel',serif;font-size:clamp(11px,2.8vw,14px);letter-spacing:4px;color:#8a7548;margin-top:14px}
.convient-fr{font-family:'Great Vibes',cursive;font-size:clamp(26px,7vw,38px);color:var(--gold-deep);line-height:1.2;margin-top:6px}
.convient-ar{font-family:'Amiri',serif;font-size:clamp(15px,4vw,18px);color:#6a5c44;direction:rtl;margin-top:4px}

/* countdown */
.countdown{display:flex;justify-content:center;gap:clamp(10px,4vw,26px);margin:14px auto 0;flex-wrap:wrap}
.cd-cell{min-width:64px;padding:14px 8px;border:1px solid rgba(201,164,76,.45);border-radius:10px;
  background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(247,241,227,.3));box-shadow:0 6px 22px -12px rgba(140,109,42,.5)}
.cd-num{font-family:'Cinzel',serif;font-size:clamp(22px,6vw,32px);font-weight:600;color:var(--gold-deep);line-height:1;font-variant-numeric:tabular-nums}
.cd-lab{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;color:#9a8048;margin-top:6px}

/* detail cards */
.details{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
@media(max-width:560px){.details{grid-template-columns:1fr;gap:22px}}
.card{padding:26px 14px;border-radius:14px;position:relative;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(247,241,227,.25));
  border:1px solid rgba(201,164,76,.35);box-shadow:0 10px 30px -18px rgba(140,109,42,.6);transition:transform .5s ease, box-shadow .5s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px -18px rgba(140,109,42,.65)}
.card .ic{width:42px;height:42px;margin:0 auto 12px;color:var(--gold)}
.card .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4}
.card .t-fr{font-size:17px;color:#3a3020;line-height:1.45;font-weight:500}
.card .t-ar{font-family:'Amiri',serif;font-size:15px;color:#6a5c44;direction:rtl;margin-top:6px}
.maplink{display:inline-block;margin-top:10px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;color:var(--gold-deep);
  border-bottom:1px solid var(--gold);padding-bottom:2px;text-decoration:none;transition:.3s}
.maplink:hover{color:#7c5f23;letter-spacing:3px}

.closing-fr{font-family:'Great Vibes',cursive;font-size:clamp(24px,6.5vw,34px);color:var(--gold-deep);line-height:1.25}
.final-logo{width:clamp(96px,26vw,140px);height:auto;margin-top:30px;filter:drop-shadow(0 6px 14px rgba(140,109,42,.3))}
.signoff{font-family:'Cinzel',serif;font-size:10px;letter-spacing:4px;color:#a08544;margin-top:8px}

/* floating action buttons */
.fab-stack{position:fixed;bottom:calc(20px + var(--safe-bot));right:20px;z-index:40;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab{width:50px;height:50px;border-radius:50%;border:1px solid var(--gold);
  background:rgba(250,246,236,.92);color:var(--gold-deep);cursor:pointer;display:none;align-items:center;justify-content:center;
  box-shadow:0 6px 20px -6px rgba(0,0,0,.3);backdrop-filter:blur(4px);transition:transform .3s;padding:0}
.fab.show{display:flex}
.fab:hover{transform:scale(1.08)}
.fab:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}
.fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}
.eq i{width:2.5px;background:var(--gold-deep);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.15s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.fab.paused .eq i{animation-play-state:paused;height:5px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.r{opacity:1;transform:none}.orn path,.orn line{stroke-dashoffset:0}.orn .diamond{opacity:1}}

/* ===== LANGUAGE TOGGLE ===== */
.lang-switch{position:fixed;top:calc(16px + var(--safe-top));right:16px;z-index:42;display:none;gap:4px;

.lang-switch button{border:0;background:transparent;cursor:pointer;font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;
  color:var(--gold-deep);padding:6px 11px;border-radius:30px;transition:.3s}
.lang-switch button.active{background:var(--gold);color:#fff}
.lang-switch button:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}

body.lang-fr [data-lang="fr"]{display:revert}
body.lang-ar [data-lang="ar"]{display:revert}
body.lang-en [data-lang="en"]{display:revert}
body.lang-ar .frame{direction:rtl}
body.lang-ar .invite-fr,body.lang-ar .convient-fr,body.lang-ar .closing-fr{font-style:normal}

/* ===== PHOTO ===== */
.photo-wrap{margin:30px auto 6px;max-width:340px;position:relative}
.photo-frame{position:relative;padding:12px;background:linear-gradient(145deg,#f3e3b4,#c9a44c);border-radius:6px;box-shadow:0 18px 50px -22px rgba(140,109,42,.8)}
.photo-frame img{display:block;width:100%;border-radius:3px}
.photo-frame::after{content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,.55);border-radius:3px;pointer-events:none}

/* ===== TIMELINE ===== */
.timeline{margin:20px auto;max-width:520px;position:relative;padding-left:0}
.tl-item{display:flex;gap:16px;align-items:flex-start;text-align:left;padding:14px 0;position:relative}
.tl-dot{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);
  display:flex;align-items:center;justify-content:center;color:var(--gold);background:rgba(255,255,255,.5)}
.tl-dot svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4}
.tl-line{position:absolute;left:22px;top:46px;bottom:-14px;width:1px;background:rgba(201,164,76,.4)}
.tl-item:last-child .tl-line{display:none}
.tl-body{flex:1}
.tl-body .tl-t{font-family:'Cinzel',serif;font-size:13px;letter-spacing:2px;color:var(--gold-deep)}
.tl-body .tl-d{font-size:17px;color:#4a3e2c;line-height:1.4}
body.lang-ar .tl-item{text-align:right}
body.lang-ar .tl-line{left:auto;right:22px}

/* ===== PROGRAM ===== */
.program{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:520px;margin:18px auto}
@media(max-width:480px){.program{grid-template-columns:1fr}}
.prog-cell{padding:16px;border:1px solid rgba(201,164,76,.3);border-radius:10px;background:rgba(255,255,255,.4)}
.prog-time{font-family:'Cinzel',serif;font-size:18px;color:var(--gold-deep);font-variant-numeric:tabular-nums}
.prog-name{font-size:16px;color:#4a3e2c;margin-top:2px}
.dress{margin-top:18px}
.swatches{display:flex;gap:10px;justify-content:center;margin-top:10px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}

/* ===== GALLERY ===== */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:560px;margin:18px auto 0}
@media(max-width:520px){.gallery{grid-template-columns:repeat(2,1fr);gap:6px}}
.g-item{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:10px;cursor:pointer;border:1px solid rgba(201,164,76,.35);background:#f0e7d0;transition:transform .4s ease}
.g-item img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease, filter .6s ease}
.g-item:hover img{transform:scale(1.06)}
.g-item:hover{transform:translateY(-3px)}
.g-empty{grid-column:1/-1;padding:30px;text-align:center;font-style:italic;color:#8a7548}

/* lightbox */
.lb{position:fixed;inset:0;z-index:90;background:rgba(11,8,5,.94);display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(6px)}
.lb.show{display:flex;animation:fadeUp .3s ease}
.lb img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 30px 80px -20px #000}
.lb-close,.lb-prev,.lb-next{position:absolute;background:rgba(250,246,236,.12);border:1px solid rgba(241,216,148,.4);
  color:var(--gold-bright);width:46px;height:46px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-close{top:24px;right:24px}.lb-prev{left:18px;top:50%;transform:translateY(-50%)}.lb-next{right:18px;top:50%;transform:translateY(-50%)}
.lb-close svg,.lb-prev svg,.lb-next svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.lb-close:hover,.lb-prev:hover,.lb-next:hover{background:rgba(241,216,148,.2)}

/* ===== BUTTONS ===== */
.btn-gold{display:inline-flex;align-items:center;gap:8px;cursor:pointer;margin:8px 6px 0;
  padding:13px 26px;border:1px solid var(--gold);border-radius:40px;background:transparent;
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:var(--gold-deep);
  text-decoration:none;transition:.4s;position:relative;overflow:hidden}
.btn-gold span{position:relative;z-index:2}
.btn-gold svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;position:relative;z-index:2}
.btn-gold::before{content:"";position:absolute;inset:0;z-index:1;background:var(--gold);transform:translateX(-101%);transition:transform .45s ease}
.btn-gold:hover{color:#fff}.btn-gold:hover::before{transform:translateX(0)}
.btn-gold:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}

/* ===== RSVP ===== */
.rsvp-box{max-width:440px;margin:18px auto 0;text-align:center}
.rsvp-box input,.rsvp-box select,.rsvp-box textarea{width:100%;margin:7px 0;padding:13px 16px;
  border:1px solid rgba(201,164,76,.5);border-radius:10px;background:rgba(255,255,255,.6);
  font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--ink);outline:none;transition:.3s}
.rsvp-box input:focus,.rsvp-box select:focus,.rsvp-box textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,164,76,.15)}
.rsvp-box textarea{min-height:70px;resize:vertical}
.attend-toggle{display:flex;gap:10px;margin:8px 0}
.attend-toggle label{flex:1;cursor:pointer}
.attend-toggle input{position:absolute;opacity:0;pointer-events:none}
.attend-toggle span{display:block;padding:12px;border:1px solid rgba(201,164,76,.5);border-radius:10px;
  font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;color:var(--gold-deep);transition:.3s;text-align:center}
.attend-toggle input:checked+span{background:var(--gold);color:#fff;border-color:var(--gold)}
.attend-toggle input:focus-visible+span{outline:2px solid var(--gold-bright);outline-offset:2px}
.rsvp-send{width:100%;margin-top:10px;cursor:pointer;padding:15px;border:0;border-radius:40px;
  background:linear-gradient(120deg,var(--gold-deep),var(--gold),var(--gold-bright));
  color:#fff;font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;transition:.3s}
.rsvp-send:hover{filter:brightness(1.08)}
.rsvp-send:disabled{opacity:.5;cursor:not-allowed}
.rsvp-thanks{display:none;font-family:'Great Vibes',cursive;font-size:30px;color:var(--gold-deep);padding:20px;line-height:1.3}
.rsvp-thanks.show{display:block;animation:fadeUp .8s}

/* ===== GUESTBOOK ===== */
.wishes{max-width:520px;margin:14px auto 0}
.wish{padding:14px 18px;margin:10px 0;border-radius:12px;background:rgba(255,255,255,.5);
  border:1px solid rgba(201,164,76,.3);text-align:left;animation:fadeUp .6s}
body.lang-ar .wish{text-align:right}
.wish .w-name{font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;color:var(--gold-deep);margin-bottom:4px}
.wish .w-msg{font-size:17px;color:#4a3e2c;line-height:1.4;font-style:italic}
.wish-empty{font-size:16px;color:#8a7548;font-style:italic;padding:10px}

/* ===== SHARE SHEET (fallback when Web Share API not available) ===== */
.share-sheet{position:fixed;inset:0;z-index:91;background:rgba(11,8,5,.7);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.share-sheet.show{display:flex;animation:fadeUp .25s ease}
.share-sheet-inner{background:var(--cream);border-radius:24px 24px 0 0;padding:28px 22px calc(28px + var(--safe-bot));width:100%;max-width:520px;text-align:center}
.share-title{font-family:'Cinzel',serif;font-size:13px;letter-spacing:3px;color:var(--gold-deep);margin-bottom:18px}
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.share-opt{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:0;cursor:pointer;color:var(--gold-deep);font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px}
.share-opt-ic{width:48px;height:48px;border-radius:50%;border:1px solid rgba(201,164,76,.5);display:flex;align-items:center;justify-content:center;background:#fff;transition:.3s}
.share-opt:hover .share-opt-ic{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(140,109,42,.6)}
.share-opt svg{width:22px;height:22px}
</style>
</head>

        <span class="share-opt-ic"><svg viewBox="0 0 24 24" fill="#0088cc"><path d="M22 3L2 11l5.5 2 2 6.5L13 16l5.5 4L22 3z"/></svg></span>
        Telegram
      </button>
      <button class="share-opt" data-share="sms" type="button">
        <span class="share-opt-ic"><svg viewBox="0 0 24 24" fill="none" stroke="var(--gold-deep)" stroke-width="1.6"><path d="M21 11.5a8.4 8.4 0 0 1-1 4 8.5 8.5 0 0 1-7.6 4.6 8.4 8.4 0 0 1-4-1L3 21l1.9-5.4a8.4 8.4 0 0 1-1-4 8.5 8.5 0 0 1 4.6-7.6 8.4 8.4 0 0 1 4-1A8.5 8.5 0 0 1 21 11.5z"/></svg></span>
        SMS
      </button>
      <button class="share-opt" data-share="copy" type="button">
        <span class="share-opt-ic"><svg viewBox="0 0 24 24" fill="none" stroke="var(--gold-deep)" stroke-width="1.6"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span>
        <span id="copyLabel">Copier</span>
      </button>
    </div>
  </div>
</div>

<script>
'use strict';
const CONFIG = JSON.parse(document.getElementById('wedding-config').textContent);

/* ---------- TINY UTILITIES ---------- */
const $  = (s, p=document) => p.querySelector(s);
const $$ = (s, p=document) => Array.from(p.querySelectorAll(s));
const esc = s => (s||'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const get = (path, obj=CONFIG) => path.split('.').reduce((o,k)=>o==null?o:o[k], obj);

/* ---------- THEME (CSS vars from config) ---------- */
(function applyTheme(){
  const t = CONFIG.theme || {};
  const root = document.documentElement.style;
  if(t.gold)       root.setProperty('--gold', t.gold);
  if(t.goldBright) root.setProperty('--gold-bright', t.goldBright);
  if(t.goldSoft)   root.setProperty('--gold-soft', t.goldSoft);
  if(t.goldDeep)   root.setProperty('--gold-deep', t.goldDeep);
  if(t.cream)      root.setProperty('--cream', t.cream);
  if(t.night)     { root.setProperty('--night', t.night); document.body.style.background = t.night; }
})();

/* ---------- DOCUMENT TITLE / META ---------- */
(function applyMeta(){
  const g = CONFIG.couple.groom.first, b = CONFIG.couple.bride.first;
  document.title = `${g} & ${b} — Invitation de mariage`;
})();

/* ---------- STATIC RENDERS (run once before language pass) ---------- */
function renderStatic(){
  const c = CONFIG.couple;
  $('#nameGroom').textContent = c.groom.first.toUpperCase();
  $('#nameBride').textContent = c.bride.first.toUpperCase();
  $('#surnames').textContent  = `${c.groom.last}  ·  ${c.bride.last}`;
  $('#signoff').textContent   = `${c.groom.first.toUpperCase()} & ${c.bride.first.toUpperCase()} · ${new Date(CONFIG.date.iso).getFullYear()}`;

  // venue per-language
  ['fr','ar','en'].forEach(lang => {
    const v = `${CONFIG.venue.name[lang]}<br>${CONFIG.venue.city[lang]}`;
    const cell = $(`#venue${lang[0].toUpperCase()+lang.slice(1)}`);
    if(cell) cell.innerHTML = v;
    const dCell = $(`#date${lang[0].toUpperCase()+lang.slice(1)}`);
    if(dCell) dCell.textContent = CONFIG.date.display[lang];
  });

  // map links
  const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CONFIG.venue.mapsQuery)}`;
  $('#mapLink').href = mapUrl;
  $('#directionsBtn').href = mapUrl;

  // dress code swatches
  $('#swatches').innerHTML = (CONFIG.dressCode||[])
    .map(c => `<div class="sw" style="background:${c}"></div>`).join('');

  // story / timeline
  const ICONS = {
    heart: '<path d="M12 21s-7-5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5-7 10-7 10z"/>',
    ring:  '<circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3-6 7-6s7 2 7 6"/>',
    star:  '<path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5L12 21l-5-2.9 1-5.5-4-3.9 5.5-.8z"/>'
  };
  $('#timeline').innerHTML = (CONFIG.story||[]).map((s,i,arr) => `
    <div class="tl-item">
      <div class="tl-dot"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[s.icon]||ICONS.heart}</svg></div>
      ${i<arr.length-1 ? '<div class="tl-line"></div>' : ''}
      <div class="tl-body">
        ${['fr','ar','en'].map(l => `<div class="tl-t" data-lang="${l}">${esc(s.title[l]||'')}</div>`).join('')}
        ${['fr','ar','en'].map(l => `<div class="tl-d" data-lang="${l}">${esc(s.text[l]||'')}</div>`).join('')}
      </div>
    </div>`).join('');

  // program
  $('#program').innerHTML = (CONFIG.program||[]).map(p => `
    <div class="prog-cell">
      <div class="prog-time">${esc(p.time)}</div>
      ${['fr','ar','en'].map(l => `<div class="prog-name" data-lang="${l}">${esc(p.name[l]||'')}</div>`).join('')}
    </div>`).join('');

  // gallery (only if non-empty)
  const gal = CONFIG.gallery||[];
  if(gal.length && CONFIG.features.gallery){
    $('#gallerySection').style.display = '';
    $('#gallery').innerHTML = gal.map((src,i) => `
      <button class="g-item" type="button" data-idx="${i}" aria-label="Photo ${i+1}">
        <img src="${esc(src)}" alt="" loading="lazy" />
      </button>`).join('');
  }

  // RSVP form placeholders (filled in lang pass)
  // hide whole sections if disabled
  if(!CONFIG.features.guestbook) $$('.eyebrow[data-i18n="guestbook"]').forEach(e => e.closest('.frame') && (e.style.display='none'));
}

/* ---------- LANGUAGE ---------- */
function setLang(lang){
  if(!CONFIG.i18n.available.includes(lang)) lang = CONFIG.i18n.default;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.body.classList.remove('lang-fr','lang-ar','lang-en');
  document.body.classList.add('lang-'+lang);
  $$('#langSwitch button').forEach(b => b.classList.toggle('active', b.dataset.set === lang));

  // resolve [data-i18n] tokens — innerHTML so values may contain <br>; CONFIG is trusted (same-origin payload).
  $$('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = get('i18n.'+key) ?? get(key);
    if(val == null) return;
    if(typeof val === 'object'){
      el.innerHTML = val[lang] || val.fr || '';
    } else {
      el.innerHTML = val;
    }
  });

  // countdown labels
  const cdl = (CONFIG.i18n.cdLabels && CONFIG.i18n.cdLabels[lang]) || CONFIG.i18n.cdLabels?.fr || [];
  $$('[data-cdlab]').forEach(el => { el.textContent = cdl[+el.dataset.cdlab] || ''; });

  // copy-label inside share sheet
  const copyLabels = { fr:'Copier', ar:'نسخ', en:'Copy' };
  const cp = $('#copyLabel'); if(cp) cp.dataset.base = copyLabels[lang] || 'Copy';
  if(cp && cp.textContent !== '✓') cp.textContent = cp.dataset.base;

  // dynamic placeholders that depend on language
  const t = CONFIG.i18n;
  $('#rName').placeholder = t.fullName[lang];
  $('#rMsg').placeholder  = t.messagePlaceholder[lang];
  $('#wName').placeholder = t.yourName[lang];
  $('#wMsg').placeholder  = t.yourWish[lang];
  const seats = $('#rSeats');
  Array.from(seats.options).forEach(opt => {
    const n = parseInt(opt.value, 10);
    opt.textContent = (n === 1 ? `1 ${t.person[lang]}` : `${opt.value === '5' ? '5+' : n} ${t.people[lang]}`);
  });

  // re-render guestbook so empty-state text matches language
  renderWishes();
}

/* ---------- COUNTDOWN ---------- */
function countdown(){
  const target = new Date(CONFIG.date.iso).getTime();
  function tick(){
    const diff = target - Date.now();
    const d = Math.max(0, Math.floor(diff/86400000));
    const h = Math.max(0, Math.floor(diff%86400000/3600000));
    const m = Math.max(0, Math.floor(diff%3600000/60000));
    const s = Math.max(0, Math.floor(diff%60000/1000));
    const p = n => String(n).padStart(2,'0');
    $('#cd-d').textContent = p(d);
    $('#cd-h').textContent = p(h);
    $('#cd-m').textContent = p(m);
    $('#cd-s').textContent = p(s);
  }
  tick(); setInterval(tick, 1000);
}

/* ---------- ICS CALENDAR ---------- */
function buildCalendar(){
  const fmt = iso => iso.replace(/[-:]/g,'').replace(/\.\d+/, '').slice(0,15);
  const c = CONFIG.couple;
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wedding//Invitation//EN','BEGIN:VEVENT',
    `UID:${(c.monogram||'wedding').replace(/\W/g,'')}-${new Date(CONFIG.date.iso).getFullYear()}@wedding`,
    `DTSTAMP:${fmt(CONFIG.date.iso)}`,
    `DTSTART:${fmt(CONFIG.date.iso)}`,
    `DTEND:${fmt(CONFIG.date.endIso || CONFIG.date.iso)}`,
    `SUMMARY:Mariage ${c.groom.first} & ${c.bride.first}`,
    `LOCATION:${CONFIG.venue.name.fr}, ${CONFIG.venue.city.fr}`,
    `DESCRIPTION:${CONFIG.i18n.inviteLead.fr}`,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const btn = $('#calBtn');
  btn.href = URL.createObjectURL(blob);
  btn.download = `mariage-${c.groom.first}-${c.bride.first}.ics`.toLowerCase();
}

/* ---------- PHOTO PRESENCE ---------- */
function checkPhoto(){
  if(!CONFIG.features.photo) return;
  const img = $('#couplePhoto'), wrap = $('#photoWrap');
  img.alt = `${CONFIG.couple.groom.first} & ${CONFIG.couple.bride.first}`;
  img.src = CONFIG.assets.photo || 'couple.jpg';
  img.onload  = () => { wrap.style.display = 'block'; };
  img.onerror = () => { wrap.style.display = 'none'; };
  if(img.complete && img.naturalWidth > 0) wrap.style.display = 'block';
}

/* ---------- RSVP ---------- */
function initRSVP(){
  $('#rsvpForm').addEventListener('submit', e => {
    e.preventDefault();
    const lang = document.documentElement.lang || 'fr';
    const name = $('#rName').value.trim();
    if(!name){ $('#rName').focus(); return; }
    const att   = document.querySelector('input[name=att]:checked').value;
    const seats = $('#rSeats').value;
    const msg   = $('#rMsg').value.trim();

    // store locally (SaaS later: POST to backend)
    const key = 'rsvp_'+(CONFIG.couple.monogram||'fe');
    const list = JSON.parse(localStorage.getItem(key) || '[]');
    list.push({ name, att, seats, msg, t: Date.now() });
    localStorage.setItem(key, JSON.stringify(list));

    // mailto fallback
    if(CONFIG.contact && CONFIG.contact.email && CONFIG.contact.email.indexOf('@') > 0){
      const sub  = encodeURIComponent(`RSVP Mariage — ${name}`);
      const body = encodeURIComponent(`Nom: ${name}\nPrésence: ${att==='oui'?'Oui':'Non'}\nPersonnes: ${seats}\nMessage: ${msg}`);
      const a = document.createElement('a');
      a.href = `mailto:${CONFIG.contact.email}?subject=${sub}&body=${body}`;
      a.click();
    }

    $('#rsvpForm').style.display = 'none';
    const t = $('#rsvpThanks');
    const tpl = att === 'oui' ? CONFIG.i18n.thanksAttend[lang] : CONFIG.i18n.thanksNoAttend[lang];
    t.innerHTML = tpl.replace('{name}', esc(name));
    t.classList.add('show');
  });
}

/* ---------- GUESTBOOK ---------- */
function wishKey(){ return 'wishes_'+(CONFIG.couple.monogram||'fe'); }
function renderWishes(){
  const box = $('#wishes'); if(!box) return;
  const lang = document.documentElement.lang || 'fr';
  const list = JSON.parse(localStorage.getItem(wishKey()) || '[]');
  if(!list.length){
    box.innerHTML = `<div class="wish-empty">${esc(CONFIG.i18n.emptyWishes[lang]||'')}</div>`;
    return;
  }
  box.innerHTML = list.slice().reverse().map(w =>
    `<div class="wish"><div class="w-name">${esc(w.name)}</div><div class="w-msg">« ${esc(w.msg)} »</div></div>`
  ).join('');
}
function initGuestbook(){
  $('#wishSend').addEventListener('click', () => {
    const name = $('#wName').value.trim();
    const msg  = $('#wMsg').value.trim();
    if(!name){ $('#wName').focus(); return; }
    if(!msg){  $('#wMsg').focus();  return; }
    const list = JSON.parse(localStorage.getItem(wishKey()) || '[]');
    list.push({ name, msg, t: Date.now() });
    localStorage.setItem(wishKey(), JSON.stringify(list));
    $('#wName').value = ''; $('#wMsg').value = '';
    renderWishes();
  });
}

/* ---------- GALLERY LIGHTBOX ---------- */
function initGallery(){
  const gal = CONFIG.gallery || [];
  if(!gal.length) return;
  const lb = $('#lightbox'), img = $('#lbImg');
  let idx = 0;
  const show = i => { idx = (i + gal.length) % gal.length; img.src = gal[idx]; img.alt = `Photo ${idx+1}`; };
  const open = i => { show(i); lb.classList.add('show'); lb.setAttribute('aria-hidden','false'); };
  const close = () => { lb.classList.remove('show'); lb.setAttribute('aria-hidden','true'); };
  $('#gallery').addEventListener('click', e => {
    const item = e.target.closest('.g-item'); if(!item) return;
    open(parseInt(item.dataset.idx, 10));
  });
  $('#lbClose').addEventListener('click', close);
  $('#lbPrev').addEventListener('click',  () => show(idx-1));
  $('#lbNext').addEventListener('click',  () => show(idx+1));
  lb.addEventListener('click', e => { if(e.target === lb) close(); });
  document.addEventListener('keydown', e => {
    if(!lb.classList.contains('show')) return;
    if(e.key === 'Escape') close();
    if(e.key === 'ArrowLeft')  show(idx-1);
    if(e.key === 'ArrowRight') show(idx+1);
  });
}

/* ---------- SHARE ---------- */
function shareUrl(){ return location.href; }
function shareText(){
  const lang = document.documentElement.lang || 'fr';
  return (CONFIG.shareText && CONFIG.shareText[lang]) || CONFIG.shareText?.fr || document.title;
}
function initShare(){
  if(!CONFIG.features.share){ $('#shareBtn').style.display = 'none'; return; }
  const sheet = $('#shareSheet');
  $('#shareBtn').addEventListener('click', async () => {
    if(navigator.share){
      try { await navigator.share({ title: document.title, text: shareText(), url: shareUrl() }); return; }
      catch(_) { /* user cancelled or unsupported — fall through to sheet */ }
    }
    sheet.classList.add('show');
  });
  sheet.addEventListener('click', e => { if(e.target === sheet) sheet.classList.remove('show'); });
  $$('.share-opt').forEach(b => b.addEventListener('click', async () => {
    const k = b.dataset.share, url = shareUrl(), text = shareText();
    if(k === 'whatsapp') window.open(`https://wa.me/?text=${encodeURIComponent(text + ' — ' + url)}`, '_blank');
    else if(k === 'telegram') window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`, '_blank');
    else if(k === 'sms') window.location.href = `sms:?&body=${encodeURIComponent(text + ' ' + url)}`;
    else if(k === 'copy'){
      try {
        await navigator.clipboard.writeText(url);
        const cp = $('#copyLabel'); const base = cp.dataset.base || 'Copy';
        cp.textContent = '✓';
        setTimeout(()=>{ cp.textContent = base; }, 1400);
      } catch(_) {}
    }
    setTimeout(()=>sheet.classList.remove('show'), 200);
  }));
}

/* ---------- PETALS + DUST (kept from original — works well) ---------- */
(function(){
  const c=$('#dust'),x=c.getContext('2d');let w,h,parts=[];
  function size(){w=c.width=innerWidth;h=c.height=innerHeight;}
  function make(){const n=Math.min(70,Math.floor(innerWidth/12));
    parts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.3,
      vy:Math.random()*.25+.05,vx:(Math.random()-.5)*.2,a:Math.random()*.5+.2,tw:Math.random()*Math.PI*2}));}
  function loop(){x.clearRect(0,0,w,h);
    parts.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.tw+=.02;
      if(p.y>h+5){p.y=-5;p.x=Math.random()*w}if(p.x<-5)p.x=w;if(p.x>w+5)p.x=0;
      const tw=(Math.sin(p.tw)+1)/2;x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba(220,180,90,'+(p.a*tw*.7)+')';x.shadowBlur=6;x.shadowColor='rgba(231,200,120,.6)';x.fill();});
    requestAnimationFrame(loop);}
  size();make();loop();addEventListener('resize',()=>{size();make();});
})();

const FLOWERS=[
  '<svg width="$SZ" height="$SZ" viewBox="0 0 40 40"><g opacity="$OP"><circle cx="20" cy="20" r="5" fill="#f6d98c"/><g fill="$COL"><ellipse cx="20" cy="9" rx="6" ry="9"/><ellipse cx="31" cy="17" rx="6" ry="9" transform="rotate(72 31 17)"/><ellipse cx="27" cy="30" rx="6" ry="9" transform="rotate(144 27 30)"/><ellipse cx="13" cy="30" rx="6" ry="9" transform="rotate(216 13 30)"/><ellipse cx="9" cy="17" rx="6" ry="9" transform="rotate(288 9 17)"/></g></g></svg>',
  '<svg width="$SZ" height="$HT" viewBox="0 0 20 28"><path d="M10 0 C18 8 18 20 10 28 C2 20 2 8 10 0Z" fill="$COL" opacity="$OP"/></svg>',
  '<svg width="$SZ" height="$SZ" viewBox="0 0 24 24"><g opacity="$OP"><path d="M12 2 C16 7 16 14 12 20 C8 14 8 7 12 2Z" fill="$COL"/><path d="M12 20 L12 24" stroke="#a9b87a" stroke-width="1.4"/></g></svg>'
];
const PETAL_COLORS=['#f4b8c4','#f0a6b6','#f6c9d3','#e9c97f','#f0dba0','#ead0e6','#f7d3a8'];
function makeFlower(){
  const el = document.createElement('div'); el.className = 'petal';
  const tpl = FLOWERS[Math.floor(Math.random()*FLOWERS.length)];
  const col = PETAL_COLORS[Math.floor(Math.random()*PETAL_COLORS.length)];
  const sz = 12 + Math.random()*20, op = (0.55 + Math.random()*0.4).toFixed(2);
  el.innerHTML = tpl.split('$SZ').join(sz).split('$HT').join(sz*1.35).split('$COL').join(col).split('$OP').join(op);
  el.style.left = Math.random()*100 + 'vw';
  const dur = 7 + Math.random()*8, drift = (Math.random()-.5)*220, spin = (Math.random()>.5?1:-1)*(300+Math.random()*360), sway = 30+Math.random()*40;
  el.animate([
    {transform:'translateY(-50px) translateX(0) rotate(0deg)', opacity:0, offset:0},
    {opacity:op, offset:.08},
    {transform:`translateY(${innerHeight*0.5}px) translateX(${sway}px) rotate(${spin*0.5}deg)`, offset:.5},
    {opacity:op, offset:.9},
    {transform:`translateY(${innerHeight+70}px) translateX(${drift}px) rotate(${spin}deg)`, opacity:0, offset:1}
  ], { duration: dur*1000, easing:'ease-in' });
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), dur*1000+100);
}
let flowerTimer = null;
function spawnPetals(){
  for(let i=0; i<10; i++) setTimeout(makeFlower, Math.random()*4000);
  if(flowerTimer) clearInterval(flowerTimer);
  flowerTimer = setInterval(() => { if(!document.hidden) makeFlower(); }, 650);
}

/* ---------- SCROLL REVEAL + PARALLAX ---------- */
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: .18, rootMargin: '0px 0px -8% 0px' });

function parallax(){
  addEventListener('scroll', () => {
    const y = scrollY;
    $$('.name').forEach((el, i) => { el.style.transform = `translateZ(0) translateY(${y*0.02*(i?-1:1)}px)`; });
  }, { passive: true });
}

/* ---------- INTRO: button → video plays → fade to main ---------- */
const intro = $('#intro'), main = $('#main'), music = $('#music'), musicBtn = $('#musicBtn');
const introVideo = $('#introVideo'), enterBtn = $('#enterBtn');

// rewrite asset paths from CONFIG
if(CONFIG.assets){
  if(CONFIG.assets.introVideo)  introVideo.querySelector('source').src = CONFIG.assets.introVideo;
  if(CONFIG.assets.introPoster) introVideo.poster = CONFIG.assets.introPoster;
  if(CONFIG.assets.music)       music.querySelector('source').src = CONFIG.assets.music;
  if(CONFIG.assets.logoGold)    $('.final-logo').src = CONFIG.assets.logoGold;
}

let musicStarted = false;
function startMusic(){
  if(!CONFIG.features.music || musicStarted) return;
  musicStarted = true;
  musicBtn.classList.add('show');
  music.volume = 0;
  music.play().then(() => {
    musicBtn.classList.remove('paused');
    let v = 0;
    const id = setInterval(() => { v = Math.min(1, v + 0.05); music.volume = v; if(v >= 1) clearInterval(id); }, 80);
  }).catch(() => { musicBtn.classList.add('paused'); });
}

let mainAlive = false;
function ensureMainAlive(){
  if(mainAlive) return; mainAlive = true;
  countdown(); spawnPetals(); parallax();
  $('#langSwitch').classList.add('show');
  if(CONFIG.features.share) $('#shareBtn').classList.add('show');
  $$('.r').forEach(el => io.observe(el));
  setTimeout(() => {
    $$('.r').forEach(el => { if(el.getBoundingClientRect().top < innerHeight*0.92) el.classList.add('in'); });
  }, 80);
}

function closeIntro(){
  if(intro.classList.contains('gone')) return;
  intro.classList.add('gone');
  // music starts as the video ends so they don't overlap with the video's own audio
  startMusic();
  ensureMainAlive();
  setTimeout(() => { try { introVideo.pause(); } catch(_){} }, 1300);
}

function startIntro(){
  if(intro.classList.contains('playing')) return;
  intro.classList.add('playing');
  // try unmuted first; fall back to muted if the browser blocks it (rare since this is a tap)
  introVideo.muted = false;
  const tryPlay = introVideo.play();
  if(tryPlay && tryPlay.catch){
    tryPlay.catch(() => { introVideo.muted = true; introVideo.play().catch(()=>{}); });
  }
  // close when the clip ends, with a timer safety net (some browsers don't fire 'ended' on looped/short clips)
  introVideo.addEventListener('ended', closeIntro, { once: true });
  const dur = introVideo.duration && isFinite(introVideo.duration) ? introVideo.duration : 16;
  setTimeout(closeIntro, (dur + 0.6) * 1000);
}

enterBtn.addEventListener('click', startIntro);

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reducedMotion || !CONFIG.features.video){
  // honour reduced-motion / video-disabled: skip the cinematic intro entirely
  closeIntro();
}

let playing = true;
musicBtn.addEventListener('click', () => {
  if(playing){ music.pause(); musicBtn.classList.add('paused'); }
  else      { music.play().catch(()=>{}); musicBtn.classList.remove('paused'); }
  playing = !playing;
});

/* ---------- BOOTSTRAP ---------- */
renderStatic();
buildCalendar();
checkPhoto();
initRSVP();
initGuestbook();
initGallery();
initShare();
setLang(CONFIG.i18n.default || 'fr');
$$('#langSwitch button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.set)));

// ?preview=1 — skip the intro and force-reveal everything (SaaS preview pane).
if(new URLSearchParams(location.search).get('preview') === '1'){
  intro.classList.add('gone');
  musicBtn.style.display = 'none';  // no user gesture in preview
  ensureMainAlive();
  $$('.r').forEach(el => el.classList.add('in'));
}
</script>
