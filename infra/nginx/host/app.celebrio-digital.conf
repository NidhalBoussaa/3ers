# 3ers portal — client space. Photo uploads pass through here (multipart to
# the app's own upload route, which then talks to MinIO server-side) — raised
# client_max_body_size to match MAX_UPLOAD_BYTES in packages/db/src/storage.ts.
#
# Install on the server:
#   sudo cp infra/nginx/host/app.celebrio-digital.conf /etc/nginx/sites-available/app.celebrio-digital.conf
#   sudo ln -sf /etc/nginx/sites-available/app.celebrio-digital.conf /etc/nginx/sites-enabled/app.celebrio-digital.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.celebrio-digital.com

upstream celebrio_portal {
    # docker-compose binds the portal container to 127.0.0.1:3902 (loopback only).
    server 127.0.0.1:3902;
    keepalive 32;
}

server {
    server_name app.celebrio-digital.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://celebrio_portal;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;

        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # 20 MB is MAX_UPLOAD_BYTES in packages/db/src/storage.ts; +5MB headroom
    # for multipart overhead.
    client_max_body_size 25m;

    listen 80;
    listen [::]:80;
}

# certbot --nginx -d app.celebrio-digital.com rewrites this file in place.
