# 3ers invite — direct public entry for the invite app. Couples reach their
# invitation at celebrio-digital.com/{slug} (marketing proxies there
# internally), but this subdomain exists for direct access, debugging, and as
# a stable target if the internal-proxy INVITE_ORIGIN setup ever needs to
# change to something other than loopback.
#
# Install on the server:
#   sudo cp infra/nginx/host/invite.celebrio-digital.conf /etc/nginx/sites-available/invite.celebrio-digital.conf
#   sudo ln -sf /etc/nginx/sites-available/invite.celebrio-digital.conf /etc/nginx/sites-enabled/invite.celebrio-digital.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d invite.celebrio-digital.com

upstream celebrio_invite {
    # docker-compose binds the invite container to 127.0.0.1:3900 (loopback only).
    server 127.0.0.1:3900;
    keepalive 32;
}

server {
    server_name invite.celebrio-digital.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~* \.(mp4|webm|mov|m4v)$ {
        proxy_pass http://celebrio_invite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://celebrio_invite;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    listen 80;
    listen [::]:80;
}

# certbot --nginx -d invite.celebrio-digital.com rewrites this file in place
# (adds the 443 block + redirect), same pattern as rawdhaty.conf.
