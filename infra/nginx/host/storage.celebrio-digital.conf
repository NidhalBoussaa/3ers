# 3ers storage — public entry for MinIO presigned upload/download URLs.
# packages/db/src/storage.ts signs URLs against MINIO_PUBLIC_URL, which MUST
# be this exact origin: the signature covers the full request path, so unlike
# PureSmell's /media/ prefix-stripping proxy, this one passes the path through
# UNCHANGED (bucket name and all) — do not add a rewrite here.
#
# Install on the server:
#   sudo cp infra/nginx/host/storage.celebrio-digital.conf /etc/nginx/sites-available/storage.celebrio-digital.conf
#   sudo ln -sf /etc/nginx/sites-available/storage.celebrio-digital.conf /etc/nginx/sites-enabled/storage.celebrio-digital.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d storage.celebrio-digital.com

upstream celebrio_minio {
    # docker-compose binds 3ers's MinIO S3 API to 127.0.0.1:9910 — NOT 9000,
    # that port is already taken by puresmell-minio-1 on this host.
    server 127.0.0.1:9910;
    keepalive 16;
}

server {
    server_name storage.celebrio-digital.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://celebrio_minio;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    client_max_body_size 25m;

    listen 80;
    listen [::]:80;
}

# certbot --nginx -d storage.celebrio-digital.com rewrites this file in place.
