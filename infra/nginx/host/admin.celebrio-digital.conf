# 3ers admin — internal panel. On its own subdomain (not a path) so cookies
# and auth never leak between admin and the public apps.
#
# Install on the server:
#   sudo cp infra/nginx/host/admin.celebrio-digital.conf /etc/nginx/sites-available/admin.celebrio-digital.conf
#   sudo ln -sf /etc/nginx/sites-available/admin.celebrio-digital.conf /etc/nginx/sites-enabled/admin.celebrio-digital.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.celebrio-digital.com

upstream celebrio_admin {
    # docker-compose binds the admin container to 127.0.0.1:3901 (loopback only).
    server 127.0.0.1:3901;
    keepalive 32;
}

server {
    server_name admin.celebrio-digital.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://celebrio_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;

        # NextAuth session cookies can be chunked — give header buffers room
        # (same reasoning as rawdhaty.conf on this host).
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    listen 80;
    listen [::]:80;
}

# certbot --nginx -d admin.celebrio-digital.com rewrites this file in place.
