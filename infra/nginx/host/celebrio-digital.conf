# 3ers marketing — nginx reverse proxy in front of the Dockerized Next.js app.
# Owns the apex domain. Also transparently serves couples' invitation pages at
# /{slug} — that's NOT handled here, it's an internal Next.js rewrite inside
# the marketing app itself (apps/marketing/next.config.ts, INVITE_ORIGIN=
# http://127.0.0.1:3900 in prod .env) so nginx only ever needs to know about
# the marketing container.
#
# Install on the server:
#   sudo cp infra/nginx/host/celebrio-digital.conf /etc/nginx/sites-available/celebrio-digital.conf
#   sudo ln -sf /etc/nginx/sites-available/celebrio-digital.conf /etc/nginx/sites-enabled/celebrio-digital.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d celebrio-digital.com -d www.celebrio-digital.com
#
# Until certbot runs, only the port-80 block below is valid; certbot rewrites
# this file to add the 443 server + HTTP->HTTPS redirect automatically.

upstream celebrio_marketing {
    # docker-compose binds the marketing container to 127.0.0.1:3903 (loopback only).
    server 127.0.0.1:3903;
    keepalive 32;
}

server {
    server_name celebrio-digital.com www.celebrio-digital.com;

    # Certbot's HTTP-01 challenge is served from here during issuance/renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The films on the landing page are large and content-hashed; the app
    # already sets long-lived Cache-Control on them, this just lets nginx
    # serve repeats fast without round-tripping to the upstream.
    location ~* \.(mp4|webm|mov|m4v)$ {
        proxy_pass http://celebrio_marketing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://celebrio_marketing;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    listen 80;
    listen [::]:80;
}

# After `certbot --nginx -d celebrio-digital.com -d www.celebrio-digital.com`
# runs, it injects a 443 server block above (or a second one below, certbot's
# choice) with:
#   listen 443 ssl; ssl_certificate ...; ssl_certificate_key ...;
#   include /etc/letsencrypt/options-ssl-nginx.conf;
#   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
# and rewrites this :80 block into a redirect, same as rawdhaty.conf /
# puresmell.conf on this host.
