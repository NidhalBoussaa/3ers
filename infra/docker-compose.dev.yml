# Usage: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up
services:

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@3ers.tn
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-dev}
    depends_on:
      - postgres

  invite:
    volumes:
      - ../apps/invite:/app/apps/invite
    command: pnpm dev

  marketing:
    volumes:
      - ../apps/marketing:/app/apps/marketing
    command: pnpm dev

  admin:
    volumes:
      - ../apps/admin:/app/apps/admin
    command: pnpm dev

  portal:
    volumes:
      - ../apps/portal:/app/apps/portal
    command: pnpm dev
